openapi: 3.0.1

servers:
  - url: http://localhost:20385/

info:
  description: Service for storing large objects in the Data Vault
  version: 1.3.0
  title: dd-lob-store-api
  contact:
    email: info@dans.knaw.nl
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

paths:
  /:
    get:
      summary: Returns a description of the service.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                description: a plain text, human readable description of the service
                example: |
                  LOB Store Running (v1.3.0)

  /transfers:
    post:
      operationId: addTransfers
      summary: Add one or more new transfers to the queue
      requestBody:
        description: A list of transfer request details
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TransferRequest'
      responses:
        '207':
          description: Multi-Status. Results for each transfer request in the same order as the input.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransferResponseItem'
        '400':
          description: Invalid request body

  /transfers/{id}:
    get:
      operationId: getTransferStatus
      summary: Retrieve the status of a transfer
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the transfer
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferStatusInfo'
        '404':
          description: Transfer not found

  /transfers/hash/{hash}:
    get:
      operationId: getTransfersByHash
      summary: Retrieve a list of transfer requests by hash
      parameters:
        - name: hash
          in: path
          required: true
          description: The SHA-1 hash of the file
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by status
          schema:
            $ref: '#/components/schemas/TransferStatus'
        - name: datastation
          in: query
          required: false
          description: Filter by datastation
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransferStatusInfo'

  /locations/{store}/{hash}:
    get:
      operationId: getLocationByHash
      summary: Retrieve the location of a file by its SHA-1 hash
      description: This only works for files that have been completely processed.
      parameters:
        - name: store
          in: path
          required: true
          description: The name of the datastation whose LOB store to query
          schema:
            type: string
        - name: hash
          in: path
          required: true
          description: The SHA-1 hash of the file
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '404':
          description: Location not found for the given hash

  /datastations/{datastation}/flush-transfers:
    post:
      operationId: flushTransfers
      summary: Flush pending transfers for a specific datastation
      description: |
        Forces a packaging task for downloaded files for the given datastation,
        even if the total size is below the minimal bucket size threshold.
        Padding will be added to ensure the package meets the minimal size requirements.

        This operation should only be used when the service is not currently receiving transfers.
        Otherwise, multiple packaging tasks may be created for the same files.
      parameters:
        - name: datastation
          in: path
          required: true
          description: The name of the datastation to flush transfers for
          schema:
            type: string
      responses:
        '202':
          description: Accepted. A packaging task was created.
        '204':
          description: No Content. No pending transfers were found for the datastation; no action was taken.
        '503':
          description: Service Unavailable. The service is currently unavailable or does not have the necessary resources to process the request; try again later.

components:
  schemas:
    TransferRequest:
      type: object
      properties:
        dataverseFileId:
          type: integer
          format: int64
          description: The Dataverse file ID to download (as a long)
        sha1Sum:
          type: string
          description: The SHA-1 hash of the file, used for verifying the integrity of the file after download
        datastation:
          type: string
          description: The name of the datastation where the file is located. This is used to determine which credentials to use for downloading the file.
      required:
        - dataverseFileId
        - sha1Sum
        - datastation

    TransferResponseItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the transfer if it was created.
        dataverseFileId:
          type: integer
          format: int64
          description: The Dataverse file ID for which this transfer was requested.
        sha1Sum:
          type: string
          description: The SHA-1 hash of the file, used for verifying the integrity of the file after download
        datastation:
          type: string
          description: The name of the datastation where the file is located. This is used to determine which credentials to use for downloading the file.
        status:
          type: integer
          description: The HTTP status code for this specific item (e.g., 201, 303, 409).
        location:
          type: string
          description: The URI of the existing transfer or location (if status is 303).
        message:
          type: string
          description: Error message if the specific transfer failed (e.g., if status is 409).

    TransferStatusInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TransferStatus'
      required:
        - id
        - status

    TransferStatus:
      type: string
      enum:
        - PENDING
        - INSPECTED
        - DOWNLOADING
        - DOWNLOADED
        - PACKAGING
        - PACKAGED
        - UPLOADING
        - UPLOADED
        - VERIFYING
        - DONE
        - REJECTED
        - FAILED

    LocationResponse:
      type: object
      properties:
        datastation:
          type: string
          description: The LOB Store's Data Station
        bucket:
          type: string
          description: The bucket where the file is stored
      required:
        - datastation
        - bucket
